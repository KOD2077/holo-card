<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover
  "
>

<meta
  name="theme-color"
  content="#090a0d"
>

<title>Holographic Card</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

}

body {

  background:

    radial-gradient(
      circle at 50% 42%,
      #191b21 0%,
      #0d0e12 58%,
      #07080a 100%
    );


  display:
    grid;

  place-items:
    center;


  overflow:
    hidden;


  touch-action:
    none;


  user-select:
    none;

  -webkit-user-select:
    none;


  padding:

    env(safe-area-inset-top)

    env(safe-area-inset-right)

    env(safe-area-inset-bottom)

    env(safe-area-inset-left);

}


/* =========================================================
   CARD
========================================================= */

.card {

  width:
    min(
      84vw,
      360px
    );


  aspect-ratio:
    0.718;


  perspective:
    820px;


  touch-action:
    none;


  user-select:
    none;

}


/* =========================================================
   CARD ROTATOR
========================================================= */

.card__rotator {

  --rotate-x:
    0deg;

  --rotate-y:
    0deg;


  --light-x:
    50%;

  --light-y:
    50%;


  --light-x2:
    50%;

  --light-y2:
    50%;


  --holo:
    0.18;


  --motion:
    0;


  position:
    relative;


  width:
    100%;

  height:
    100%;


  overflow:
    hidden;


  border-radius:
    4.55% / 3.5%;


  transform:

    rotateX(
      var(--rotate-x)
    )

    rotateY(
      var(--rotate-y)
    );


  transform-origin:
    center;


  will-change:
    transform;


  box-shadow:

    0 30px 70px
      rgba(
        0,
        0,
        0,
        0.54
      ),

    0 8px 24px
      rgba(
        0,
        0,
        0,
        0.38
      );

}


/* =========================================================
   CARD IMAGE
========================================================= */

.card__image {

  position:
    absolute;


  inset:
    0;


  width:
    100%;

  height:
    100%;


  display:
    block;


  object-fit:
    cover;


  border-radius:
    inherit;


  pointer-events:
    none;


  user-select:
    none;


  -webkit-user-drag:
    none;

}


/* =========================================================
   CONTINUOUS SPECTRUM
========================================================= */

.card__spectrum {

  position:
    absolute;


  inset:
    -14%;


  border-radius:
    inherit;


  background:

    conic-gradient(

      from 205deg

      at
      var(--light-x)
      var(--light-y),


      rgba(
        255,
        90,
        125,
        0.25
      ),

      rgba(
        255,
        192,
        80,
        0.28
      ),

      rgba(
        220,
        255,
        115,
        0.23
      ),

      rgba(
        75,
        235,
        204,
        0.25
      ),

      rgba(
        74,
        199,
        255,
        0.28
      ),

      rgba(
        120,
        135,
        255,
        0.26
      ),

      rgba(
        205,
        105,
        255,
        0.27
      ),

      rgba(
        255,
        105,
        177,
        0.23
      ),

      rgba(
        255,
        90,
        125,
        0.25
      )

    );


  background-size:
    185%
    185%;


  background-position:

    var(--light-x2)
    var(--light-y2);


  mix-blend-mode:
    soft-light;


  opacity:

    calc(

      0.15

      +

      var(--holo)
      *
      0.48

      +

      var(--motion)
      *
      0.18

    );


  filter:

    saturate(
      calc(
        1
        +
        var(--holo)
        *
        0.65
      )
    );


  pointer-events:
    none;

}


/* =========================================================
   SOFT COLOR FIELD
========================================================= */

.card__spectrum-soft {

  position:
    absolute;


  inset:
    -20%;


  background:

    radial-gradient(

      ellipse
      72%
      58%

      at

      var(--light-x)
      var(--light-y),


      rgba(
        255,
        255,
        255,
        0.42
      )

      0%,


      rgba(
        145,
        255,
        245,
        0.25
      )

      20%,


      rgba(
        105,
        203,
        255,
        0.16
      )

      36%,


      rgba(
        185,
        120,
        255,
        0.11
      )

      52%,


      rgba(
        255,
        125,
        190,
        0.08
      )

      65%,


      transparent
      82%

    );


  mix-blend-mode:
    screen;


  opacity:

    calc(

      var(--holo)
      *
      0.58

      +

      var(--motion)
      *
      0.28

    );


  filter:

    blur(
      12px
    )

    saturate(
      1.15
    )

    brightness(
      1.08
    );


  transform:
    scale(
      1.10
    );


  pointer-events:
    none;

}


/* =========================================================
   CSS GRAIN
========================================================= */

.card__grain {

  position:
    absolute;


  inset:
    0;


  background-image:

    radial-gradient(
      circle at 18% 22%,
      rgba(
        255,
        255,
        255,
        0.17
      )
      0.32px,
      transparent
      0.70px
    ),

    radial-gradient(
      circle at 80% 32%,
      rgba(
        255,
        255,
        255,
        0.13
      )
      0.30px,
      transparent
      0.70px
    ),

    radial-gradient(
      circle at 35% 76%,
      rgba(
        255,
        255,
        255,
        0.12
      )
      0.30px,
      transparent
      0.68px
    );


  background-size:

    5px 5px,

    7px 7px,

    6px 6px;


  mix-blend-mode:
    overlay;


  opacity:

    calc(

      0.035

      +

      var(--holo)
      *
      0.075

      +

      var(--motion)
      *
      0.08

    );


  pointer-events:
    none;

}


/* =========================================================
   FINE LINES
========================================================= */

.card__lines {

  position:
    absolute;


  inset:
    -10%;


  background:

    repeating-linear-gradient(

      117deg,

      rgba(
        255,
        255,
        255,
        0
      )

      0px,


      rgba(
        255,
        255,
        255,
        0
      )

      2px,


      rgba(
        255,
        255,
        255,
        0.028
      )

      2.7px,


      rgba(
        255,
        255,
        255,
        0
      )

      3.7px

    );


  background-size:
    140%
    140%;


  background-position:

    var(--light-x2)
    var(--light-y2);


  mix-blend-mode:
    screen;


  opacity:

    calc(

      0.15

      +

      var(--holo)
      *
      0.17

      +

      var(--motion)
      *
      0.16

    );


  filter:
    blur(
      0.2px
    );


  pointer-events:
    none;

}


/* =========================================================
   IRIDESCENCE
========================================================= */

.card__iridescence {

  position:
    absolute;


  inset:
    -16%;


  background:

    linear-gradient(

      103deg,

      rgba(
        255,
        105,
        160,
        0.07
      )

      0%,


      rgba(
        255,
        222,
        115,
        0.09
      )

      20%,


      rgba(
        115,
        255,
        205,
        0.10
      )

      38%,


      rgba(
        105,
        220,
        255,
        0.11
      )

      56%,


      rgba(
        130,
        145,
        255,
        0.10
      )

      73%,


      rgba(
        232,
        110,
        255,
        0.08
      )

      89%,


      rgba(
        255,
        110,
        165,
        0.07
      )

      100%

    );


  background-size:
    255%
    255%;


  background-position:

    var(--light-x2)
    var(--light-y2);


  mix-blend-mode:
    color;


  opacity:

    calc(

      var(--holo)
      *
      0.46

      +

      var(--motion)
      *
      0.20

    );


  filter:

    blur(
      5px
    )

    saturate(
      1.18
    );


  pointer-events:
    none;

}


/* =========================================================
   BIG SPECULAR
========================================================= */

.card__specular {

  position:
    absolute;


  inset:
    0;


  background:

    radial-gradient(

      ellipse
      63%
      50%

      at

      var(--light-x)
      var(--light-y),


      rgba(
        255,
        255,
        255,
        0.92
      )

      0%,


      rgba(
        255,
        255,
        255,
        0.48
      )

      16%,


      rgba(
        255,
        255,
        255,
        0.20
      )

      32%,


      rgba(
        255,
        255,
        255,
        0.06
      )

      48%,


      transparent
      70%

    );


  mix-blend-mode:
    screen;


  opacity:

    min(

      1,

      calc(

        0.08

        +

        var(--holo)
        *
        0.36

        +

        var(--motion)
        *
        0.65

      )

    );


  filter:

    blur(
      1.5px
    )

    brightness(
      1.20
    );


  pointer-events:
    none;

}


/* =========================================================
   REFLECTION BAND
========================================================= */

.card__reflection {

  position:
    absolute;


  inset:
    -76%;


  background:

    linear-gradient(

      112deg,

      transparent
      38%,


      rgba(
        255,
        255,
        255,
        0
      )
      43%,


      rgba(
        255,
        255,
        255,
        0.08
      )
      46%,


      rgba(
        255,
        255,
        255,
        0.35
      )
      49%,


      rgba(
        255,
        255,
        255,
        0.74
      )
      50%,


      rgba(
        225,
        255,
        255,
        0.34
      )
      52%,


      rgba(
        255,
        255,
        255,
        0.07
      )
      56%,


      transparent
      61%

    );


  transform:

    translateX(

      calc(

        (
          var(--light-x)
          -
          50%
        )

        *

        1.4

      )

    )

    translateY(

      calc(

        (
          var(--light-y)
          -
          50%
        )

        *

        0.9

      )

    );


  mix-blend-mode:
    screen;


  opacity:

    calc(

      0.04

      +

      var(--holo)
      *
      0.15

      +

      var(--motion)
      *
      0.92

    );


  filter:

    blur(
      5px
    )

    brightness(
      1.30
    );


  pointer-events:
    none;

}


/* =========================================================
   COLORED REFLECTION EDGE
========================================================= */

.card__color-reflection {

  position:
    absolute;


  inset:
    -76%;


  background:

    linear-gradient(

      111deg,

      transparent
      38%,


      rgba(
        60,
        220,
        255,
        0
      )
      43%,


      rgba(
        60,
        220,
        255,
        0.15
      )
      47%,


      rgba(
        255,
        130,
        220,
        0.22
      )
      50%,


      rgba(
        125,
        155,
        255,
        0.18
      )
      53%,


      transparent
      62%

    );


  transform:

    translateX(

      calc(

        (
          var(--light-x)
          -
          50%
        )

        *

        1.52

      )

    )

    translateY(

      calc(

        (
          var(--light-y)
          -
          50%
        )

        *

        0.95

      )

    );


  mix-blend-mode:
    screen;


  opacity:

    calc(

      var(--holo)
      *
      0.10

      +

      var(--motion)
      *
      0.58

    );


  filter:
    blur(
      7px
    );


  pointer-events:
    none;

}


/* =========================================================
   EDGE
========================================================= */

.card__edge {

  position:
    absolute;


  inset:
    0;


  border-radius:
    inherit;


  box-shadow:

    inset
    0
    0
    0
    1px
    rgba(
      255,
      255,
      255,
      0.18
    );


  pointer-events:
    none;

}


/* =========================================================
   VIGNETTE
========================================================= */

.card__vignette {

  position:
    absolute;


  inset:
    0;


  background:

    radial-gradient(

      ellipse at center,

      transparent
      44%,


      rgba(
        0,
        0,
        0,
        0.04
      )
      72%,


      rgba(
        0,
        0,
        0,
        0.24
      )
      100%

    );


  mix-blend-mode:
    multiply;


  pointer-events:
    none;

}


/* =========================================================
   MOBILE
========================================================= */

@media (
  max-width: 600px
) {

  .card {

    width:
      min(
        85vw,
        360px
      );

  }

}

</style>

</head>


<body>


<div class="card">

  <div class="card__rotator">


    <!-- ======================================================
         ★★★ 你的图片 ★★★

         只需要替换 card.png
    ======================================================= -->

    <img
      class="card__image"
      src="./card.png"
      alt=""
      draggable="false"
    >


    <!-- 全息层 -->

    <div
      class="card__spectrum"
    ></div>


    <div
      class="card__spectrum-soft"
    ></div>


    <div
      class="card__iridescence"
    ></div>


    <!-- 微纹理 -->

    <div
      class="card__grain"
    ></div>


    <div
      class="card__lines"
    ></div>


    <!-- 高光 -->

    <div
      class="card__specular"
    ></div>


    <div
      class="card__reflection"
    ></div>


    <div
      class="card__color-reflection"
    ></div>


    <!-- 边缘 -->

    <div
      class="card__edge"
    ></div>


    <div
      class="card__vignette"
    ></div>


  </div>

</div>


<script>

/* ============================================================
   DOM
============================================================ */

const card =
  document.querySelector(
    ".card"
  );


const rotator =
  document.querySelector(
    ".card__rotator"
  );


/* ============================================================
   STATE
============================================================ */


/*
  当前卡片旋转
*/

let currentX =
  0;

let currentY =
  0;


/*
  目标旋转
*/

let targetX =
  0;

let targetY =
  0;


/*
  当前光源
*/

let lightX =
  50;

let lightY =
  50;


/*
  目标光源
*/

let targetLightX =
  50;

let targetLightY =
  50;


/*
  Holo
*/

let holo =
  0.18;

let targetHolo =
  0.18;


/*
  Motion
*/

let motion =
  0;


/*
  动画
*/

let animationFrame =
  null;


/* ============================================================
   SENSOR STATE
============================================================ */


/*
  非常重要：

  只有真正收到 orientation 数据，
  才把它设为 true。
*/

let orientationWorking =
  false;


let motionWorking =
  false;


let sensorPermissionAsked =
  false;


/*
  当前手机姿态中心
*/

let baseBeta =
  null;


let baseGamma =
  null;


/* ============================================================
   SENSOR SETTINGS
============================================================ */


/*
  ★★★★★★★★★★★★★★★★★★★★★★★★★★

  陀螺仪灵敏度。

  推荐：

  2.5 = 温和
  3.0 = 灵敏
  3.5 = 很灵敏

  当前：
*/

const SENSOR_SENSITIVITY =
  3.2;


/*
  最大旋转角度。
*/

const MAX_TILT =
  22;


/*
  卡片追踪速度。

  越大越跟手。
*/

const ROTATION_SMOOTH =
  0.28;


/*
  光源追踪速度。

  比卡片略慢。
*/

const LIGHT_SMOOTH =
  0.18;


/*
  Holo 变化速度。
*/

const HOLO_SMOOTH =
  0.16;


/*
  摇晃响应。

  越大越容易出现闪光。
*/

const MOTION_SENSITIVITY =
  0.12;


/*
  摇晃平滑。
*/

const MOTION_SMOOTH =
  0.42;


/*
  摇晃之后的衰减。

  越高：
  闪光持续越久。
*/

const MOTION_DECAY =
  0.955;


/*
  Flash 触发阈值。
*/

const FLASH_THRESHOLD =
  2.4;


/*
  Flash 最短间隔。
*/

const FLASH_COOLDOWN =
  260;


let lastFlash =
  0;


/* ============================================================
   FLASH ELEMENT
============================================================ */

const flash =
  document.createElement(
    "div"
  );


flash.style.position =
  "absolute";


flash.style.inset =
  "-35%";


flash.style.pointerEvents =
  "none";


flash.style.borderRadius =
  "inherit";


flash.style.opacity =
  "0";


flash.style.mixBlendMode =
  "screen";


flash.style.background =

  `

  linear-gradient(

    108deg,

    transparent 25%,

    rgba(
      255,
      255,
      255,
      0
    ) 36%,

    rgba(
      255,
      255,
      255,
      0.16
    ) 43%,

    rgba(
      255,
      255,
      255,
      0.92
    ) 48%,

    rgba(
      255,
      255,
      255,
      1
    ) 50%,

    rgba(
      225,
      250,
      255,
      0.76
    ) 52%,

    rgba(
      255,
      255,
      255,
      0.20
    ) 56%,

    transparent 67%

  ),

  linear-gradient(

    108deg,

    transparent 32%,

    rgba(
      60,
      220,
      255,
      0
    ) 43%,

    rgba(
      65,
      225,
      255,
      0.18
    ) 47%,

    rgba(
      255,
      125,
      220,
      0.26
    ) 50%,

    rgba(
      125,
      150,
      255,
      0.20
    ) 53%,

    transparent 64%

  )

  `;


flash.style.transform =
  "translateX(-135%) skewX(-14deg)";


flash.style.filter =
  "blur(2px) brightness(1.5)";


rotator.appendChild(
  flash
);


/* ============================================================
   SENSOR PERMISSION
============================================================ */


/*
  用户第一次触摸时请求。

  不再使用 once:true。

  这样如果用户第一次拒绝，
  后面仍可以再次尝试。
*/

document.addEventListener(

  "pointerdown",

  () => {

    enableSensors();

  },

  {
    passive:
      true

  }

);


/* ============================================================
   ENABLE SENSORS
============================================================ */

async function enableSensors() {


  if (
    sensorPermissionAsked
    &&
    (
      orientationWorking
      ||
      motionWorking
    )
  ) {

    return;

  }


  sensorPermissionAsked =
    true;


  /*
  ==========================================================
    ORIENTATION
  ==========================================================
  */

  if (
    typeof
    DeviceOrientationEvent
    !==
    "undefined"
  ) {

    try {


      let granted =
        true;


      /*
      --------------------------------------------------------
        iOS Safari
      --------------------------------------------------------
      */

      if (

        typeof
        DeviceOrientationEvent
          .requestPermission
        ===
        "function"

      ) {

        const result =

          await
          DeviceOrientationEvent
            .requestPermission();


        granted =
          result ===
          "granted";

      }


      /*
      --------------------------------------------------------
        获得许可才监听
      --------------------------------------------------------
      */

      if (
        granted
      ) {

        window.addEventListener(

          "deviceorientation",

          handleOrientation,

          true

        );

      }

    }

    catch (
      error
    ) {

      console.warn(
        "Orientation error:",
        error
      );

    }

  }


  /*
  ==========================================================
    MOTION
  ==========================================================
  */

  if (
    typeof
    DeviceMotionEvent
    !==
    "undefined"
  ) {

    try {


      let granted =
        true;


      /*
      --------------------------------------------------------
        iOS
      --------------------------------------------------------
      */

      if (

        typeof
        DeviceMotionEvent
          .requestPermission
        ===
        "function"

      ) {

        const result =

          await
          DeviceMotionEvent
            .requestPermission();


        granted =
          result ===
          "granted";

      }


      /*
      --------------------------------------------------------
        开启 motion
      --------------------------------------------------------
      */

      if (
        granted
      ) {

        window.addEventListener(

          "devicemotion",

          handleMotion,

          true

        );

      }

    }

    catch (
      error
    ) {

      console.warn(
        "Motion error:",
        error
      );

    }

  }


  startAnimation();

}


/* ============================================================
   DEVICE ORIENTATION
============================================================ */

function handleOrientation(
  event
) {


  /*
  ==========================================================
    确认确实收到了传感器数据

    ★ 以前版本最大的问题之一
  ==========================================================
  */

  if (

    !Number.isFinite(
      event.beta
    )

    ||

    !Number.isFinite(
      event.gamma
    )

  ) {

    return;

  }


  /*
  ==========================================================
    真正收到数据后：

    才认为 sensor 工作。
  ==========================================================
  */

  orientationWorking =
    true;


  /*
  ==========================================================
    当前数据
  ==========================================================
  */

  const beta =
    Number(
      event.beta
    );


  const gamma =
    Number(
      event.gamma
    );


  /*
  ==========================================================
    第一次数据：

    当前手机状态作为中心。
  ==========================================================
  */

  if (

    baseBeta === null
    ||
    baseGamma === null

  ) {

    baseBeta =
      beta;


    baseGamma =
      gamma;


    targetX =
      0;


    targetY =
      0;


    targetLightX =
      50;


    targetLightY =
      50;


    targetHolo =
      0.20;


    startAnimation();


    return;

  }


  /*
  ==========================================================
    相对角度
  ==========================================================
  */

  let deltaBeta =

    beta -
    baseBeta;


  let deltaGamma =

    gamma -
    baseGamma;


  /*
  ==========================================================
    限制
  ==========================================================
  */

  deltaBeta =
    clamp(
      deltaBeta,
      -35,
      35
    );


  deltaGamma =
    clamp(
      deltaGamma,
      -35,
      35
    );


  /*
  ==========================================================
    非线性灵敏度

    小动作更明显。
  ==========================================================
  */

  let nx =

    deltaGamma /
    30;


  let ny =

    -deltaBeta /
    30;


  nx =

    Math.tanh(

      nx *
      SENSOR_SENSITIVITY

    );


  ny =

    Math.tanh(

      ny *
      SENSOR_SENSITIVITY

    );


  /*
  ==========================================================
    Rotation
  ==========================================================
  */

  targetY =

    nx *
    MAX_TILT;


  targetX =

    ny *
    MAX_TILT;


  /*
  ==========================================================
    Light

    比卡片运动稍大。
  ==========================================================
  */

  targetLightX =

    50
    +
    nx *
    48;


  targetLightY =

    50
    -
    ny *
    48;


  /*
  ==========================================================
    Holo

    即使轻微倾斜也有反光。
  ==========================================================
  */

  const amount =

    Math.min(

      1,

      Math.sqrt(

        nx * nx
        +
        ny * ny

      )

    );


  targetHolo =

    0.22
    +
    amount *
    0.78;


  startAnimation();

}


/* ============================================================
   DEVICE MOTION
============================================================ */

function handleMotion(
  event
) {


  const acceleration =

    event.acceleration
    ||
    event.accelerationIncludingGravity;


  if (
    !acceleration
  ) {

    return;

  }


  const x =
    Number(
      acceleration.x
    )
    || 0;


  const y =
    Number(
      acceleration.y
    )
    || 0;


  const z =
    Number(
      acceleration.z
    )
    || 0;


  motionWorking =
    true;


  /*
  ==========================================================
    magnitude
  ==========================================================
  */

  const magnitude =

    Math.sqrt(

      x * x
      +
      y * y
      +
      z * z

    );


  /*
  ==========================================================
    去掉重力

    静止时约 9.81
  ==========================================================
  */

  const movement =

    Math.abs(

      magnitude
      -
      9.81

    );


  /*
  ==========================================================
    Motion energy
  ==========================================================
  */

  const energy =

    clamp(

      movement
      *
      MOTION_SENSITIVITY,

      0,
      1

    );


  motion +=

    (
      energy
      -
      motion
    )

    *
    MOTION_SMOOTH;


  /*
  ==========================================================
    强烈摇晃：

    扫光
  ==========================================================
  */

  if (

    movement >
    FLASH_THRESHOLD

  ) {

    triggerFlash();

  }


  startAnimation();

}


/* ============================================================
   FLASH
============================================================ */

function triggerFlash() {


  const now =
    performance.now();


  if (

    now -
    lastFlash
    <
    FLASH_COOLDOWN

  ) {

    return;

  }


  lastFlash =
    now;


  flash.animate(

    [

      {

        opacity:
          0,

        transform:
          "translateX(-135%) skewX(-14deg)"

      },


      {

        opacity:
          1,

        transform:
          "translateX(-40%) skewX(-14deg)"

      },


      {

        opacity:
          0.78,

        transform:
          "translateX(-2%) skewX(-14deg)"

      },


      {

        opacity:
          0.25,

        transform:
          "translateX(58%) skewX(-14deg)"

      },


      {

        opacity:
          0,

        transform:
          "translateX(135%) skewX(-14deg)"

      }

    ],

    {

      duration:
        610,

      easing:
        "cubic-bezier(.08,.72,.18,1)",

      fill:
        "none"

    }

  );

}


/* ============================================================
   ANIMATION START
============================================================ */

function startAnimation() {


  if (
    animationFrame ===
    null
  ) {

    animationFrame =

      requestAnimationFrame(
        animate
      );

  }

}


/* ============================================================
   ANIMATION LOOP
============================================================ */

function animate() {


  /*
  ==========================================================
    Rotation

    高响应速度
  ==========================================================
  */

  currentX +=

    (
      targetX -
      currentX
    )

    *
    ROTATION_SMOOTH;


  currentY +=

    (
      targetY -
      currentY
    )

    *
    ROTATION_SMOOTH;


  /*
  ==========================================================
    Light
  ==========================================================
  */

  lightX +=

    (
      targetLightX -
      lightX
    )

    *
    LIGHT_SMOOTH;


  lightY +=

    (
      targetLightY -
      lightY
    )

    *
    LIGHT_SMOOTH;


  /*
  ==========================================================
    Holo
  ==========================================================
  */

  holo +=

    (
      targetHolo -
      holo
    )

    *
    HOLO_SMOOTH;


  /*
  ==========================================================
    Motion decay
  ==========================================================
  */

  motion *=
    MOTION_DECAY;


  /*
  ==========================================================
    Apply rotation
  ==========================================================
  */

  rotator.style.setProperty(

    "--rotate-x",

    `${currentX.toFixed(3)}deg`

  );


  rotator.style.setProperty(

    "--rotate-y",

    `${currentY.toFixed(3)}deg`

  );


  /*
  ==========================================================
    Light
  ==========================================================
  */

  rotator.style.setProperty(

    "--light-x",

    `${lightX.toFixed(2)}%`

  );


  rotator.style.setProperty(

    "--light-y",

    `${lightY.toFixed(2)}%`

  );


  /*
  ==========================================================
    Secondary light

    光略微“拖尾”。
  ==========================================================
  */

  const secondaryX =

    50
    +

    (
      lightX -
      50
    )
    *
    1.32;


  const secondaryY =

    50
    +

    (
      lightY -
      50
    )
    *
    1.14;


  rotator.style.setProperty(

    "--light-x2",

    `${clamp(
      secondaryX,
      -10,
      110
    ).toFixed(2)}%`

  );


  rotator.style.setProperty(

    "--light-y2",

    `${clamp(
      secondaryY,
      -10,
      110
    ).toFixed(2)}%`

  );


  /*
  ==========================================================
    Holo
  ==========================================================
  */

  rotator.style.setProperty(

    "--holo",

    holo.toFixed(3)

  );


  /*
  ==========================================================
    Motion
  ==========================================================
  */

  rotator.style.setProperty(

    "--motion",

    motion.toFixed(3)

  );


  /*
  ==========================================================
    Continue animation
  ==========================================================
  */

  const moving =

    Math.abs(
      targetX -
      currentX
    )
    >
    0.01

    ||

    Math.abs(
      targetY -
      currentY
    )
    >
    0.01

    ||

    Math.abs(
      targetLightX -
      lightX
    )
    >
    0.01

    ||

    Math.abs(
      targetLightY -
      lightY
    )
    >
    0.01

    ||

    Math.abs(
      targetHolo -
      holo
    )
    >
    0.01

    ||

    motion
    >
    0.01;


  if (
    moving
  ) {

    animationFrame =

      requestAnimationFrame(
        animate
      );

  }

  else {

    animationFrame =
      null;

  }

}


/* ============================================================
   DOUBLE TAP = RECALIBRATE
============================================================ */

let lastTap =
  0;


card.addEventListener(

  "pointerup",

  () => {


    const now =
      performance.now();


    if (

      now -
      lastTap
      <
      350

    ) {

      recalibrate();

    }


    lastTap =
      now;

  },

  {
    passive:
      true
  }

);


function recalibrate() {


  /*
    下一帧传感器数据会被当成中心。
  */

  baseBeta =
    null;


  baseGamma =
    null;

}


/* ============================================================
   TOUCH / MOUSE FALLBACK
============================================================ */

card.addEventListener(

  "pointermove",

  event => {


    /*
    ==========================================================
      如果已经真正检测到陀螺仪：

      手机不再用手指控制。
    ==========================================================
    */

    if (
      orientationWorking
    ) {

      return;

    }


    const rect =
      card.getBoundingClientRect();


    const x =

      clamp(

        (
          event.clientX -
          rect.left
        )

        /

        rect.width

        *
        100,

        0,
        100

      );


    const y =

      clamp(

        (
          event.clientY -
          rect.top
        )

        /

        rect.height

        *
        100,

        0,
        100

      );


    /*
    ==========================================================
      Pointer -> rotation
    ==========================================================
    */

    const nx =

      (
        x -
        50
      )
      /
      50;


    const ny =

      (
        50 -
        y
      )
      /
      50;


    targetY =

      nx *
      MAX_TILT;


    targetX =

      ny *
      MAX_TILT;


    /*
    ==========================================================
      Light
    ==========================================================
    */

    targetLightX =
      x;


    targetLightY =
      y;


    /*
    ==========================================================
      Holo
    ==========================================================
    */

    targetHolo =

      0.20

      +

      Math.min(

        0.80,

        Math.sqrt(

          nx * nx
          +
          ny * ny

        )

      );


    startAnimation();

  }

);


/* ============================================================
   POINTER LEAVE
============================================================ */

card.addEventListener(

  "pointerleave",

  () => {


    /*
      如果陀螺仪已经成功，
      不执行鼠标 reset。
    */

    if (
      orientationWorking
    ) {

      return;

    }


    targetX =
      0;


    targetY =
      0;


    targetLightX =
      50;


    targetLightY =
      50;


    targetHolo =
      0.18;


    startAnimation();

  }

);


/* ============================================================
   INITIAL
============================================================ */

rotator.style.setProperty(
  "--rotate-x",
  "0deg"
);


rotator.style.setProperty(
  "--rotate-y",
  "0deg"
);


rotator.style.setProperty(
  "--light-x",
  "50%"
);


rotator.style.setProperty(
  "--light-y",
  "50%"
);


rotator.style.setProperty(
  "--light-x2",
  "50%"
);


rotator.style.setProperty(
  "--light-y2",
  "50%"
);


rotator.style.setProperty(
  "--holo",
  "0.18"
);


rotator.style.setProperty(
  "--motion",
  "0"
);


/*
  启动初始渲染。
*/

startAnimation();

</script>
