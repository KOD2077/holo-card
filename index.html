<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover
    "
  >

  <meta
    name="theme-color"
    content="#111318"
  >

  <title>Holographic Card</title>


  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }


    body {

      background:
        #111318;

      display:
        grid;

      place-items:
        center;

      overflow:
        hidden;

      touch-action:
        none;

      user-select:
        none;

      -webkit-user-select:
        none;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }


    /* =========================================================
       CARD
    ========================================================= */

    .card {

      width:
        min(
          82vw,
          340px
        );

      aspect-ratio:
        0.718;

      perspective:
        600px;

      touch-action:
        none;

      user-select:
        none;

      -webkit-user-select:
        none;
    }


    /* =========================================================
       ROTATOR
    ========================================================= */

    .card__rotator {

      --tilt-left-right:
        0deg;

      --tilt-up-down:
        0deg;


      --pointer-x:
        50%;

      --pointer-y:
        50%;


      --pointer-from-center:
        0;


      --effect-intensity:
        0;


      --background-x:
        50%;

      --background-y:
        50%;


      /*
        摇晃增强
      */
      --motion-boost:
        0;


      width:
        100%;

      height:
        100%;

      position:
        relative;

      overflow:
        hidden;

      border-radius:
        4.55% / 3.5%;


      transform:

        rotateY(
          var(--tilt-left-right)
        )

        rotateX(
          var(--tilt-up-down)
        );


      transform-origin:
        center;

      will-change:
        transform;


      box-shadow:

        0 20px 42px
        rgba(
          0,
          0,
          0,
          0.46
        ),

        0 6px 18px
        rgba(
          0,
          0,
          0,
          0.34
        );
    }


    /* =========================================================
       IMAGE
    ========================================================= */

    .card__image {

      position:
        absolute;

      inset:
        0;

      width:
        100%;

      height:
        100%;

      display:
        block;

      object-fit:
        cover;

      border-radius:
        inherit;

      pointer-events:
        none;

      user-select:
        none;

      -webkit-user-drag:
        none;
    }


    /* =========================================================
       MAIN HOLOGRAPHIC SHINE

       保留最开始版本的思路。

       只稍微降低彩虹割裂感。
    ========================================================= */

    .card__shine {

      position:
        absolute;

      inset:
        0;

      border-radius:
        inherit;


      background-image:


        /*
        -------------------------------------------------------
          连续色谱
        -------------------------------------------------------
        */

        linear-gradient(

          115deg,

          rgba(
            255,
            102,
            130,
            0.28
          )

          0%,


          rgba(
            255,
            201,
            93,
            0.28
          )

          17%,


          rgba(
            135,
            244,
            170,
            0.26
          )

          34%,


          rgba(
            86,
            220,
            223,
            0.28
          )

          51%,


          rgba(
            95,
            165,
            255,
            0.28
          )

          67%,


          rgba(
            153,
            115,
            255,
            0.27
          )

          82%,


          rgba(
            238,
            112,
            228,
            0.24
          )

          100%

        ),


        /*
        -------------------------------------------------------
          鼠标/陀螺仪光源
        -------------------------------------------------------
        */

        radial-gradient(

          farthest-corner circle

          at

          var(--pointer-x)
          var(--pointer-y),


          rgba(
            255,
            255,
            255,
            0.55
          )

          0%,


          rgba(
            164,
            255,
            246,
            0.25
          )

          24%,


          rgba(
            170,
            132,
            255,
            0.14
          )

          47%,


          transparent
          74%

        );


      background-size:

        210% 210%,

        200% 200%;


      background-position:

        var(--background-x)
        var(--background-y),

        var(--background-x)
        var(--background-y);


      background-blend-mode:

        soft-light,
        screen;


      mix-blend-mode:
        color-dodge;


      /*
        比原版稍微亮一点，
        但不会变成整张彩虹。
      */

      opacity:

        min(

          1,

          calc(

            0.18

            +

            var(--effect-intensity)
            *
            0.50

            +

            var(--motion-boost)
            *
            0.16

          )

        );


      filter:

        brightness(

          calc(

            0.60

            +

            var(--pointer-from-center)
            *
            0.45

            +

            var(--motion-boost)
            *
            0.35

          )

        )

        contrast(1.55)

        saturate(

          calc(

            1

            +

            var(--motion-boost)
            *
            0.35

          )

        );


      pointer-events:
        none;
    }


    /* =========================================================
       SECOND RAINBOW LAYER

       比原版柔和，只作为色彩流动。
    ========================================================= */

    .card__shine::after {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      border-radius:
        inherit;


      background:

        linear-gradient(

          95deg,

          rgba(
            255,
            90,
            120,
            0.18
          ),

          rgba(
            255,
            220,
            110,
            0.16
          ),

          rgba(
            110,
            255,
            210,
            0.15
          ),

          rgba(
            105,
            205,
            255,
            0.18
          ),

          rgba(
            155,
            125,
            255,
            0.17
          ),

          rgba(
            240,
            110,
            220,
            0.15
          )

        );


      background-size:
        230% 230%;


      background-position:

        calc(
          var(--background-x)
          + 8%
        )

        calc(
          var(--background-y)
          - 5%
        );


      mix-blend-mode:
        lighten;


      opacity:

        calc(

          var(--effect-intensity)
          *
          0.38

          +

          var(--motion-boost)
          *
          0.18

        );


      filter:
        blur(1px)
        saturate(1.1);


      pointer-events:
        none;
    }


    /* =========================================================
       SOFT GLARE
    ========================================================= */

    .card__glare {

      position:
        absolute;

      inset:
        0;

      border-radius:
        inherit;


      background:

        radial-gradient(

          ellipse
          58%
          48%

          at

          var(--pointer-x)
          var(--pointer-y),


          rgba(
            255,
            255,
            255,
            0.78
          )

          0%,


          rgba(
            255,
            255,
            255,
            0.24
          )

          20%,


          rgba(
            255,
            255,
            255,
            0.06
          )

          40%,


          transparent
          68%

        );


      mix-blend-mode:
        hard-light;


      /*
        比原版增强。
      */

      opacity:

        min(

          1,

          calc(

            var(--effect-intensity)
            *
            0.36

            +

            var(--pointer-from-center)
            *
            var(--effect-intensity)
            *
            0.60

            +

            var(--motion-boost)
            *
            0.46

          )

        );


      filter:

        blur(0.8px)

        brightness(1.12);


      pointer-events:
        none;
    }


    /* =========================================================
       SHIMMER
    ========================================================= */

    .card__shimmer {

      position:
        absolute;

      inset:
        -65%;


      background:

        linear-gradient(

          108deg,

          transparent 34%,


          rgba(
            255,
            255,
            255,
            0
          )

          43%,


          rgba(
            255,
            255,
            255,
            0.08
          )

          46%,


          rgba(
            255,
            255,
            255,
            0.48
          )

          49%,


          rgba(
            245,
            255,
            255,
            0.78
          )

          50%,


          rgba(
            220,
            255,
            255,
            0.46
          )

          52%,


          rgba(
            255,
            255,
            255,
            0.08
          )

          55%,


          transparent 62%

        );


      transform:

        translateX(

          calc(

            (
              var(--pointer-x)
              -
              50%
            )

            *
            1.25

          )

        )

        translateY(

          calc(

            (
              var(--pointer-y)
              -
              50%
            )

            *
            0.75

          )

        );


      mix-blend-mode:
        screen;


      /*
        平时很弱，

        摇晃时明显。
      */

      opacity:

        calc(

          0.025

          +

          var(--effect-intensity)
          *
          0.08

          +

          var(--motion-boost)
          *
          0.78

        );


      filter:

        blur(
          4px
        )

        brightness(
          1.22
        );


      pointer-events:
        none;
    }


    /* =========================================================
       EDGE
    ========================================================= */

    .card__edge {

      position:
        absolute;

      inset:
        0;

      border-radius:
        inherit;


      box-shadow:

        inset
        0
        0
        0
        1px
        rgba(
          255,
          255,
          255,
          0.18
        );


      pointer-events:
        none;
    }


    /* =========================================================
       VIGNETTE
    ========================================================= */

    .card__vignette {

      position:
        absolute;

      inset:
        0;

      border-radius:
        inherit;


      background:

        radial-gradient(

          ellipse at center,

          transparent
          48%,


          rgba(
            0,
            0,
            0,
            0.05
          )

          75%,


          rgba(
            0,
            0,
            0,
            0.22
          )

          100%

        );


      mix-blend-mode:
        multiply;


      pointer-events:
        none;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (
      max-width: 600px
    ) {

      .card {

        width:
          min(
            85vw,
            350px
          );

      }

    }

  </style>

</head>


<body>


  <div class="card">

    <div class="card__rotator">


      <!-- ===================================================
           ★★★ 你的卡片 ★★★

           只需要替换：

           card.png
      ==================================================== -->

      <img
        class="card__image"
        src="./card.png"
        alt=""
        draggable="false"
      >


      <!-- 全息色彩 -->
      <div
        class="card__shine"
      ></div>


      <!-- 高光 -->
      <div
        class="card__glare"
      ></div>


      <!-- 摇晃产生的闪光 -->
      <div
        class="card__shimmer"
      ></div>


      <!-- 边缘 -->
      <div
        class="card__edge"
      ></div>


      <!-- 阴影 -->
      <div
        class="card__vignette"
      ></div>


    </div>

  </div>


<script>

/* ============================================================
   DOM
============================================================ */

const card =
  document.querySelector(
    ".card"
  );


const rotator =
  document.querySelector(
    ".card__rotator"
  );


/* ============================================================
   CURRENT
============================================================ */

let currentRotateX =
  0;


let currentRotateY =
  0;


let targetRotateX =
  0;


let targetRotateY =
  0;


/*
  光源
*/

let currentPointerX =
  50;


let currentPointerY =
  50;


let targetPointerX =
  50;


let targetPointerY =
  50;


/*
  Holo
*/

let currentIntensity =
  0;


let targetIntensity =
  0;


/*
  Motion
*/

let motionBoost =
  0;


/*
  animation
*/

let animationFrame =
  null;


/* ============================================================
   SENSOR VARIABLES
============================================================ */


/*
  当前手机中心角度
*/

let baseBeta =
  null;


let baseGamma =
  null;


/*
  ★

  只有收到真正的 orientation 数据以后
  才会变成 true。

  这是为了避免传感器逻辑把
  鼠标/触摸备用功能提前禁掉。
*/

let hasOrientationData =
  false;


let hasMotionData =
  false;


/*
  是否成功注册监听器
*/

let orientationListenerAdded =
  false;


let motionListenerAdded =
  false;


/* ============================================================
   SETTINGS
============================================================ */


/*
  手机陀螺仪灵敏度
*/

const SENSOR_SENSITIVITY =
  2.65;


/*
  最大旋转
*/

const MAX_TILT =
  18;


/*
  旋转跟随速度

  0.25 左右比较灵敏。
*/

const ROTATION_SMOOTH =
  0.25;


/*
  光源稍微慢一点，
  产生自然的反射滞后。
*/

const POINTER_SMOOTH =
  0.17;


/*
  Holo 变化速度
*/

const INTENSITY_SMOOTH =
  0.15;


/*
  Motion 响应
*/

const MOTION_SENSITIVITY =
  0.095;


/*
  Motion 平滑
*/

const MOTION_SMOOTH =
  0.40;


/*
  Motion 衰减

  比最开始版本略长。
*/

const MOTION_DECAY =
  0.94;


/*
  触发 Flash 的阈值
*/

const FLASH_THRESHOLD =
  2.8;


/*
  Flash 间隔
*/

const FLASH_COOLDOWN =
  280;


let lastFlashTime =
  0;


/* ============================================================
   SENSOR PERMISSION
============================================================ */


/*
  注意：

  不使用 once:true。

  用户如果第一次没有允许，
  后面还可以再次点击尝试。
*/

document.addEventListener(

  "pointerdown",

  function () {

    requestSensors();

  },

  {
    passive: true
  }

);


/* ============================================================
   REQUEST SENSORS
============================================================ */

async function requestSensors() {


  /*
  ==========================================================
    DEVICE ORIENTATION
  ==========================================================
  */

  if (

    typeof
    DeviceOrientationEvent
    !==
    "undefined"

    &&

    !orientationListenerAdded

  ) {

    try {


      let granted =
        true;


      /*
      --------------------------------------------------------
        iOS Safari
      --------------------------------------------------------
      */

      if (

        typeof
        DeviceOrientationEvent
          .requestPermission
        ===
        "function"

      ) {

        const result =

          await
          DeviceOrientationEvent
            .requestPermission();


        granted =
          result ===
          "granted";

      }


      /*
      --------------------------------------------------------
        注册监听
      --------------------------------------------------------
      */

      if (
        granted
      ) {

        window.addEventListener(

          "deviceorientation",

          handleOrientation,

          true

        );


        orientationListenerAdded =
          true;

      }

    }

    catch (
      error
    ) {

      console.warn(
        "DeviceOrientation permission:",
        error
      );

    }

  }


  /*
  ==========================================================
    DEVICE MOTION
  ==========================================================
  */

  if (

    typeof
    DeviceMotionEvent
    !==
    "undefined"

    &&

    !motionListenerAdded

  ) {

    try {


      let granted =
        true;


      /*
      --------------------------------------------------------
        iOS Safari
      --------------------------------------------------------
      */

      if (

        typeof
        DeviceMotionEvent
          .requestPermission
        ===
        "function"

      ) {

        const result =

          await
          DeviceMotionEvent
            .requestPermission();


        granted =
          result ===
          "granted";

      }


      /*
      --------------------------------------------------------
        注册 motion
      --------------------------------------------------------
      */

      if (
        granted
      ) {

        window.addEventListener(

          "devicemotion",

          handleMotion,

          true

        );


        motionListenerAdded =
          true;

      }

    }

    catch (
      error
    ) {

      console.warn(
        "DeviceMotion permission:",
        error
      );

    }

  }

}


/* ============================================================
   ORIENTATION
============================================================ */

function handleOrientation(
  event
) {


  const beta =
    Number(
      event.beta
    );


  const gamma =
    Number(
      event.gamma
    );


  /*
  ==========================================================
    无效数据直接忽略
  ==========================================================
  */

  if (

    !Number.isFinite(
      beta
    )

    ||

    !Number.isFinite(
      gamma
    )

  ) {

    return;

  }


  /*
  ==========================================================
    ★ 收到真实数据

    到这里才算陀螺仪真正工作。
  ==========================================================
  */

  hasOrientationData =
    true;


  /*
  ==========================================================
    第一次：

    当前姿态 = 中心
  ==========================================================
  */

  if (

    baseBeta === null

    ||

    baseGamma === null

  ) {

    baseBeta =
      beta;


    baseGamma =
      gamma;


    targetRotateX =
      0;


    targetRotateY =
      0;


    targetPointerX =
      50;


    targetPointerY =
      50;


    targetIntensity =
      0.16;


    startAnimation();


    return;

  }


  /*
  ==========================================================
    Relative angle
  ==========================================================
  */

  let deltaBeta =

    beta
    -
    baseBeta;


  let deltaGamma =

    gamma
    -
    baseGamma;


  /*
  ==========================================================
    限制
  ==========================================================
  */

  deltaBeta =
    clamp(
      deltaBeta,
      -30,
      30
    );


  deltaGamma =
    clamp(
      deltaGamma,
      -30,
      30
    );


  /*
  ==========================================================
    非线性

    轻轻动的时候更灵敏。
  ==========================================================
  */

  let nx =

    deltaGamma
    /
    30;


  let ny =

    -deltaBeta
    /
    30;


  nx =

    Math.tanh(

      nx
      *
      SENSOR_SENSITIVITY

    );


  ny =

    Math.tanh(

      ny
      *
      SENSOR_SENSITIVITY

    );


  /*
  ==========================================================
    Card rotation
  ==========================================================
  */

  targetRotateY =

    nx
    *
    MAX_TILT;


  targetRotateX =

    ny
    *
    MAX_TILT;


  /*
  ==========================================================
    Light position

    光比卡片移动得稍大一点。
  ==========================================================
  */

  targetPointerX =

    50
    +
    nx
    *
    48;


  targetPointerY =

    50
    -
    ny
    *
    48;


  /*
  ==========================================================
    Holo intensity
  ==========================================================
  */

  const amount =

    Math.min(

      1,

      Math.sqrt(

        nx * nx
        +
        ny * ny

      )

    );


  targetIntensity =

    0.16
    +
    amount
    *
    0.84;


  startAnimation();

}


/* ============================================================
   MOTION
============================================================ */

function handleMotion(
  event
) {


  const acceleration =

    event.acceleration


    ||


    event.accelerationIncludingGravity;


  if (!acceleration) {

    return;

  }


  const x =
    Number(
      acceleration.x
    )
    || 0;


  const y =
    Number(
      acceleration.y
    )
    || 0;


  const z =
    Number(
      acceleration.z
    )
    || 0;


  hasMotionData =
    true;


  /*
  ==========================================================
    Magnitude
  ==========================================================
  */

  const magnitude =

    Math.sqrt(

      x * x
      +
      y * y
      +
      z * z

    );


  /*
  ==========================================================
    去掉重力

    静止时约 9.81。
  ==========================================================
  */

  const movement =

    Math.abs(

      magnitude
      -
      9.81

    );


  /*
  ==========================================================
    Motion energy
  ==========================================================
  */

  const energy =

    clamp(

      movement
      *
      MOTION_SENSITIVITY,

      0,
      1

    );


  motionBoost +=

    (
      energy
      -
      motionBoost
    )

    *
    MOTION_SMOOTH;


  /*
  ==========================================================
    快速摇晃：

    触发扫光
  ==========================================================
  */

  if (

    movement
    >
    FLASH_THRESHOLD

  ) {

    triggerFlash();

  }


  startAnimation();

}


/* ============================================================
   FLASH
============================================================ */

function triggerFlash() {


  const now =
    performance.now();


  /*
    防止疯狂闪烁
  */

  if (

    now
    -
    lastFlashTime
    <
    FLASH_COOLDOWN

  ) {

    return;

  }


  lastFlashTime =
    now;


  /*
  ==========================================================
    第一层强白光
  ==========================================================
  */

  flashAnimation(
    1.0
  );

}


/* ============================================================
   FLASH ANIMATION
============================================================ */

function flashAnimation(
  strength
) {


  /*
  如果用户快速晃手机：

  白色高光扫过整张卡。
  */

  const flashLayer =
    document.createElement(
      "div"
    );


  flashLayer.style.position =
    "absolute";


  flashLayer.style.inset =
    "-45%";


  flashLayer.style.pointerEvents =
    "none";


  flashLayer.style.borderRadius =
    "inherit";


  flashLayer.style.mixBlendMode =
    "screen";


  flashLayer.style.background =

    `

    linear-gradient(

      108deg,

      transparent 29%,


      rgba(
        255,
        255,
        255,
        0
      ) 40%,


      rgba(
        255,
        255,
        255,
        ${0.16 * strength}
      ) 44%,


      rgba(
        255,
        255,
        255,
        ${0.92 * strength}
      ) 48.5%,


      rgba(
        255,
        255,
        255,
        ${1.0 * strength}
      ) 50%,


      rgba(
        225,
        250,
        255,
        ${0.74 * strength}
      ) 52%,


      rgba(
        255,
        255,
        255,
        ${0.16 * strength}
      ) 56%,


      transparent 66%

    ),


    linear-gradient(

      108deg,

      transparent 34%,


      rgba(
        70,
        220,
        255,
        0
      ) 43%,


      rgba(
        70,
        220,
        255,
        ${0.14 * strength}
      ) 47%,


      rgba(
        255,
        130,
        220,
        ${0.20 * strength}
      ) 50%,


      rgba(
        125,
        155,
        255,
        ${0.16 * strength}
      ) 53%,


      transparent 64%

    )

    `;


  flashLayer.style.filter =

    "blur(2px) brightness(1.45)";


  flashLayer.style.transform =

    "translateX(-135%) skewX(-14deg)";


  rotator.appendChild(
    flashLayer
  );


  /*
  ==========================================================
    动画
  ==========================================================
  */

  const animation =

    flashLayer.animate(

      [

        {

          opacity:
            0,

          transform:
            "translateX(-135%) skewX(-14deg)"

        },


        {

          opacity:
            1,

          transform:
            "translateX(-42%) skewX(-14deg)"

        },


        {

          opacity:
            0.72,

          transform:
            "translateX(-2%) skewX(-14deg)"

        },


        {

          opacity:
            0.22,

          transform:
            "translateX(54%) skewX(-14deg)"

        },


        {

          opacity:
            0,

          transform:
            "translateX(135%) skewX(-14deg)"

        }

      ],

      {

        duration:
          570,

        easing:
          "cubic-bezier(.10,.72,.18,1)",

        fill:
          "forwards"

      }

    );


  /*
  ==========================================================
    动画结束后删除
  ==========================================================
  */

  animation.finished
    .then(
      () => {

        flashLayer.remove();

      }
    )
    .catch(
      () => {}
    );

}


/* ============================================================
   ANIMATION
============================================================ */

function startAnimation() {


  if (
    animationFrame ===
    null
  ) {

    animationFrame =

      requestAnimationFrame(
        animate
      );

  }

}


/* ============================================================
   ANIMATE LOOP
============================================================ */

function animate() {


  /*
  ==========================================================
    Card
  ==========================================================
  */

  currentRotateX +=

    (
      targetRotateX
      -
      currentRotateX
    )

    *
    ROTATION_SMOOTH;


  currentRotateY +=

    (
      targetRotateY
      -
      currentRotateY
    )

    *
    ROTATION_SMOOTH;


  /*
  ==========================================================
    Pointer / light
  ==========================================================
  */

  currentPointerX +=

    (
      targetPointerX
      -
      currentPointerX
    )

    *
    POINTER_SMOOTH;


  currentPointerY +=

    (
      targetPointerY
      -
      currentPointerY
    )

    *
    POINTER_SMOOTH;


  /*
  ==========================================================
    Holo
  ==========================================================
  */

  currentIntensity +=

    (
      targetIntensity
      -
      currentIntensity
    )

    *
    INTENSITY_SMOOTH;


  /*
  ==========================================================
    Motion decay
  ==========================================================
  */

  motionBoost *=
    MOTION_DECAY;


  /*
  ==========================================================
    Apply rotation
  ==========================================================
  */

  rotator.style.setProperty(

    "--tilt-left-right",

    `${currentRotateY.toFixed(3)}deg`

  );


  rotator.style.setProperty(

    "--tilt-up-down",

    `${currentRotateX.toFixed(3)}deg`

  );


  /*
  ==========================================================
    Apply pointer
  ==========================================================
  */

  rotator.style.setProperty(

    "--pointer-x",

    `${currentPointerX.toFixed(2)}%`

  );


  rotator.style.setProperty(

    "--pointer-y",

    `${currentPointerY.toFixed(2)}%`

  );


  /*
  ==========================================================
    Background

    比 pointer 移动范围稍微大一些。
  */

  const bgX =

    50
    +

    (
      currentPointerX
      -
      50
    )
    *
    1.18;


  const bgY =

    50
    +

    (
      currentPointerY
      -
      50
    )
    *
    1.12;


  rotator.style.setProperty(

    "--background-x",

    `${clamp(
      bgX,
      -10,
      110
    ).toFixed(2)}%`

  );


  rotator.style.setProperty(

    "--background-y",

    `${clamp(
      bgY,
      -10,
      110
    ).toFixed(2)}%`

  );


  /*
  ==========================================================
    Effect
  ==========================================================
  */

  rotator.style.setProperty(

    "--effect-intensity",

    currentIntensity.toFixed(3)

  );


  /*
  ==========================================================
    Motion
  ==========================================================
  */

  rotator.style.setProperty(

    "--motion-boost",

    motionBoost.toFixed(3)

  );


  /*
  ==========================================================
    Continue?
  ==========================================================
  */

  const moving =

    Math.abs(
      targetRotateX
      -
      currentRotateX
    )
    >
    0.01

    ||

    Math.abs(
      targetRotateY
      -
      currentRotateY
    )
    >
    0.01

    ||

    Math.abs(
      targetPointerX
      -
      currentPointerX
    )
    >
    0.01

    ||

    Math.abs(
      targetPointerY
      -
      currentPointerY
    )
    >
    0.01

    ||

    Math.abs(
      targetIntensity
      -
      currentIntensity
    )
    >
    0.01

    ||

    motionBoost
    >
    0.01;


  if (
    moving
  ) {

    animationFrame =

      requestAnimationFrame(
        animate
      );

  }

  else {

    animationFrame =
      null;

  }

}


/* ============================================================
   DOUBLE TAP = RECALIBRATE
============================================================ */

let lastTap =
  0;


card.addEventListener(

  "pointerup",

  () => {


    const now =
      performance.now();


    /*
      双击卡片：

      重新校准。
    */

    if (

      now
      -
      lastTap
      <
      350

    ) {

      recalibrate();

    }


    lastTap =
      now;

  },

  {
    passive:
      true
  }

);


function recalibrate() {


  /*
    下一条 orientation 数据：

    当前姿态 = 中心。
  */

  baseBeta =
    null;


  baseGamma =
    null;

}


/* ============================================================
   DESKTOP / TOUCH FALLBACK
============================================================ */

card.addEventListener(

  "pointermove",

  event => {


    /*
      ★

      只有真的收到陀螺仪数据后，
      才禁用 pointer fallback。
    */

    if (
      hasOrientationData
    ) {

      return;

    }


    const rect =
      card.getBoundingClientRect();


    const x =

      clamp(

        (
          event.clientX
          -
          rect.left
        )
        /
        rect.width
        *
        100,

        0,
        100

      );


    const y =

      clamp(

        (
          event.clientY
          -
          rect.top
        )
        /
        rect.height
        *
        100,

        0,
        100

      );


    const centerX =
      x - 50;


    const centerY =
      y - 50;


    /*
      Rotation
    */

    targetRotateY =

      -(
        centerX
        /
        3.5
      );


    targetRotateX =

      centerY
      /
      3.5;


    /*
      Light
    */

    targetPointerX =
      x;


    targetPointerY =
      y;


    /*
      Holo
    */

    const distance =

      Math.min(

        1,

        Math.sqrt(

          Math.pow(
            centerX /
            50,
            2
          )

          +

          Math.pow(
            centerY /
            50,
            2
          )

        )

      );


    targetIntensity =

      0.15
      +
      distance
      *
      0.85;


    startAnimation();

  }

);


/* ============================================================
   POINTER LEAVE
============================================================ */

card.addEventListener(

  "pointerleave",

  () => {


    /*
      手机陀螺仪模式：

      不重置。
    */

    if (
      hasOrientationData
    ) {

      return;

    }


    targetRotateX =
      0;


    targetRotateY =
      0;


    targetPointerX =
      50;


    targetPointerY =
      50;


    targetIntensity =
      0;


    startAnimation();

  }

);


/* ============================================================
   INITIAL
============================================================ */

rotator.style.setProperty(
  "--tilt-left-right",
  "0deg"
);


rotator.style.setProperty(
  "--tilt-up-down",
  "0deg"
);


rotator.style.setProperty(
  "--pointer-x",
  "50%"
);


rotator.style.setProperty(
  "--pointer-y",
  "50%"
);


rotator.style.setProperty(
  "--background-x",
  "50%"
);


rotator.style.setProperty(
  "--background-y",
  "50%"
);


rotator.style.setProperty(
  "--effect-intensity",
  "0"
);


rotator.style.setProperty(
  "--motion-boost",
  "0"
);


/*
  启动渲染
*/

startAnimation();

</script>
