<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover
  "
>

<meta
  name="theme-color"
  content="#090a0d"
>

<title>Holographic Card</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {

  background:
    radial-gradient(
      circle at 50% 42%,
      #191b21 0%,
      #0d0e12 58%,
      #07080a 100%
    );

  display: grid;
  place-items: center;

  overflow: hidden;

  touch-action: none;

  user-select: none;
  -webkit-user-select: none;

  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}


/* =========================================================
   CARD
========================================================= */

.card {

  width:
    min(
      84vw,
      360px
    );

  aspect-ratio:
    0.718;

  perspective:
    850px;

  touch-action:
    none;

  user-select:
    none;
}


/* =========================================================
   ROTATOR
========================================================= */

.card__rotator {

  /*
  ----------------------------------------------------------
    3D
  ----------------------------------------------------------
  */

  --rotate-x:
    0deg;

  --rotate-y:
    0deg;


  /*
  ----------------------------------------------------------
    Light
  ----------------------------------------------------------
  */

  --light-x:
    50%;

  --light-y:
    50%;


  --light-x2:
    50%;

  --light-y2:
    50%;


  /*
  ----------------------------------------------------------
    Holo
  ----------------------------------------------------------
  */

  --holo:
    0.18;


  /*
  ----------------------------------------------------------
    Motion
  ----------------------------------------------------------
  */

  --motion:
    0;


  position:
    relative;

  width:
    100%;

  height:
    100%;

  border-radius:
    4.55% / 3.5%;

  overflow:
    hidden;


  transform:

    rotateX(
      var(--rotate-x)
    )

    rotateY(
      var(--rotate-y)
    );


  transform-origin:
    center;

  will-change:
    transform;


  /*
  ----------------------------------------------------------
    Shadow
  ----------------------------------------------------------
  */

  box-shadow:

    0 28px 68px
      rgba(
        0,
        0,
        0,
        0.52
      ),

    0 8px 24px
      rgba(
        0,
        0,
        0,
        0.36
      );

}


/* =========================================================
   IMAGE
========================================================= */

.card__image {

  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

  display:
    block;

  object-fit:
    cover;

  border-radius:
    inherit;

  pointer-events:
    none;

  user-select:
    none;

  -webkit-user-drag:
    none;
}


/* =========================================================
   CONTINUOUS HOLOGRAPHIC SPECTRUM

   核心全息色层。

   完全由 CSS 生成。
   
   不使用图片。
   
   不使用 repeating-linear-gradient，
   所以不会出现明显彩虹硬条。
========================================================= */

.card__spectrum {

  position:
    absolute;

  inset:
    -15%;


  border-radius:
    inherit;


  background:

    conic-gradient(

      from 205deg

      at

      var(--light-x)
      var(--light-y),


      rgba(
        255,
        91,
        126,
        0.28
      ),

      rgba(
        255,
        184,
        82,
        0.30
      ),

      rgba(
        221,
        255,
        118,
        0.25
      ),

      rgba(
        90,
        240,
        203,
        0.27
      ),

      rgba(
        79,
        202,
        255,
        0.30
      ),

      rgba(
        118,
        139,
        255,
        0.28
      ),

      rgba(
        196,
        103,
        255,
        0.28
      ),

      rgba(
        255,
        105,
        177,
        0.25
      ),

      rgba(
        255,
        91,
        126,
        0.28
      )

    );


  /*
    非常大幅的缩放。

    颜色变化因此非常缓慢。
  */

  background-size:
    190% 190%;


  background-position:

    var(--light-x2)
    var(--light-y2);


  /*
    使用 soft-light。

    不会把原图完全染色。
  */

  mix-blend-mode:
    soft-light;


  opacity:

    calc(

      0.16

      +

      var(--holo)
      *
      0.47

      +

      var(--motion)
      *
      0.18

    );


  filter:

    saturate(
      calc(
        1
        +
        var(--holo)
        *
        0.65
      )
    );


  pointer-events:
    none;
}


/* =========================================================
   LARGE SOFT SPECTRUM

   第二层：
   更宽、更柔和。

   用来填补颜色之间的空隙。
========================================================= */

.card__spectrum-soft {

  position:
    absolute;

  inset:
    -20%;


  background:

    radial-gradient(

      ellipse
      72%
      58%

      at

      var(--light-x)
      var(--light-y),


      rgba(
        255,
        255,
        255,
        0.38
      )

      0%,


      rgba(
        140,
        255,
        244,
        0.22
      )

      18%,


      rgba(
        103,
        202,
        255,
        0.13
      )

      35%,


      rgba(
        189,
        120,
        255,
        0.11
      )

      51%,


      rgba(
        255,
        130,
        191,
        0.08
      )

      64%,


      transparent
      80%

    );


  mix-blend-mode:
    screen;


  opacity:

    calc(

      var(--holo)
      *
      0.55

      +

      var(--motion)
      *
      0.22

    );


  filter:

    blur(
      13px
    )

    saturate(
      1.12
    );


  transform:
    scale(
      1.12
    );


  pointer-events:
    none;
}


/* =========================================================
   MICRO GRAIN

   纯 CSS 微细纹理。

   不用图片。

   极低对比度，避免“脏”。
========================================================= */

.card__grain {

  position:
    absolute;

  inset:
    0;


  background-image:

    radial-gradient(
      circle at 20% 20%,
      rgba(
        255,
        255,
        255,
        0.18
      )
      0.35px,
      transparent
      0.7px
    ),

    radial-gradient(
      circle at 80% 30%,
      rgba(
        255,
        255,
        255,
        0.14
      )
      0.28px,
      transparent
      0.65px
    ),

    radial-gradient(
      circle at 32% 78%,
      rgba(
        255,
        255,
        255,
        0.12
      )
      0.30px,
      transparent
      0.65px
    );


  background-size:

    5px 5px,

    7px 7px,

    6px 6px;


  mix-blend-mode:
    overlay;


  opacity:

    calc(

      0.05

      +

      var(--holo)
      *
      0.07

      +

      var(--motion)
      *
      0.08

    );


  pointer-events:
    none;
}


/* =========================================================
   MICRO LINE TEXTURE

   非常细的方向性纹理。

   增加金属膜感觉。
========================================================= */

.card__lines {

  position:
    absolute;

  inset:
    -10%;


  background:

    repeating-linear-gradient(

      118deg,

      rgba(
        255,
        255,
        255,
        0
      )

      0px,

      rgba(
        255,
        255,
        255,
        0
      )

      2px,

      rgba(
        255,
        255,
        255,
        0.025
      )

      2.7px,

      rgba(
        255,
        255,
        255,
        0
      )

      3.6px

    );


  background-size:
    140% 140%;


  background-position:

    var(--light-x2)
    var(--light-y2);


  mix-blend-mode:
    screen;


  opacity:

    calc(

      0.22

      +

      var(--holo)
      *
      0.16

      +

      var(--motion)
      *
      0.14

    );


  filter:
    blur(
      0.25px
    );


  pointer-events:
    none;
}


/* =========================================================
   METALLIC IRIDESCENT FIELD

   非常宽的低强度颜色层。

   防止颜色只有一块一块。
========================================================= */

.card__iridescence {

  position:
    absolute;

  inset:
    -15%;


  background:

    linear-gradient(

      104deg,

      rgba(
        255,
        110,
        160,
        0.08
      )

      0%,


      rgba(
        255,
        220,
        115,
        0.10
      )

      20%,


      rgba(
        120,
        255,
        205,
        0.10
      )

      38%,


      rgba(
        115,
        218,
        255,
        0.12
      )

      55%,


      rgba(
        125,
        140,
        255,
        0.10
      )

      72%,


      rgba(
        235,
        115,
        255,
        0.08
      )

      88%,


      rgba(
        255,
        115,
        164,
        0.08
      )

      100%

    );


  background-size:
    250% 250%;


  background-position:

    var(--light-x2)
    var(--light-y2);


  mix-blend-mode:
    color;


  opacity:

    calc(

      var(--holo)
      *
      0.45

      +

      var(--motion)
      *
      0.18

    );


  filter:

    blur(
      5px
    )

    saturate(
      1.15
    );


  pointer-events:
    none;
}


/* =========================================================
   LARGE SPECULAR

   ★ 闪卡主要高光
========================================================= */

.card__specular {

  position:
    absolute;

  inset:
    0;


  background:

    radial-gradient(

      ellipse
      62%
      50%

      at

      var(--light-x)
      var(--light-y),


      rgba(
        255,
        255,
        255,
        0.90
      )

      0%,


      rgba(
        255,
        255,
        255,
        0.47
      )

      17%,


      rgba(
        255,
        255,
        255,
        0.19
      )

      33%,


      rgba(
        255,
        255,
        255,
        0.06
      )

      46%,


      transparent
      70%

    );


  mix-blend-mode:
    screen;


  opacity:

    min(

      1,

      calc(

        0.10

        +

        var(--holo)
        *
        0.34

        +

        var(--motion)
        *
        0.62

      )

    );


  filter:

    blur(
      1.5px
    )

    brightness(
      1.22
    );


  pointer-events:
    none;
}


/* =========================================================
   SOFT WHITE BAND

   倾斜时出现非常宽的反射面。
========================================================= */

.card__reflection {

  position:
    absolute;

  inset:
    -75%;


  background:

    linear-gradient(

      112deg,

      transparent 39%,


      rgba(
        255,
        255,
        255,
        0.00
      )
      43%,


      rgba(
        255,
        255,
        255,
        0.08
      )
      46%,


      rgba(
        255,
        255,
        255,
        0.30
      )
      49%,


      rgba(
        255,
        255,
        255,
        0.58
      )
      50%,


      rgba(
        235,
        255,
        255,
        0.28
      )
      52%,


      rgba(
        255,
        255,
        255,
        0.06
      )
      55%,


      transparent 60%

    );


  transform:

    translateX(

      calc(

        (
          var(--light-x)
          -
          50%
        )

        *

        1.35

      )

    )

    translateY(

      calc(

        (
          var(--light-y)
          -
          50%
        )

        *

        0.85

      )

    );


  mix-blend-mode:
    screen;


  opacity:

    calc(

      0.04

      +

      var(--holo)
      *
      0.14

      +

      var(--motion)
      *
      0.78

    );


  filter:

    blur(
      6px
    )

    brightness(
      1.28
    );


  pointer-events:
    none;
}


/* =========================================================
   COLOR EDGE REFLECTION

   不是彩虹条，只是给白色高光增加一点色边。
========================================================= */

.card__color-reflection {

  position:
    absolute;

  inset:
    -75%;


  background:

    linear-gradient(

      111deg,

      transparent 39%,


      rgba(
        80,
        225,
        255,
        0
      )
      44%,


      rgba(
        80,
        225,
        255,
        0.14
      )
      47%,


      rgba(
        255,
        130,
        220,
        0.20
      )
      50%,


      rgba(
        130,
        150,
        255,
        0.16
      )
      53%,


      transparent 61%

    );


  transform:

    translateX(

      calc(

        (
          var(--light-x)
          -
          50%
        )

        *

        1.48

      )

    )

    translateY(

      calc(

        (
          var(--light-y)
          -
          50%
        )

        *

        0.95

      )

    );


  mix-blend-mode:
    screen;


  opacity:

    calc(

      var(--holo)
      *
      0.12

      +

      var(--motion)
      *
      0.54

    );


  filter:

    blur(
      8px
    );


  pointer-events:
    none;
}


/* =========================================================
   EDGE
========================================================= */

.card__edge {

  position:
    absolute;

  inset:
    0;


  border-radius:
    inherit;


  box-shadow:

    inset
    0
    0
    0
    1px
    rgba(
      255,
      255,
      255,
      0.18
    );


  pointer-events:
    none;
}


/* =========================================================
   VIGNETTE
========================================================= */

.card__vignette {

  position:
    absolute;

  inset:
    0;


  background:

    radial-gradient(

      ellipse at center,

      transparent
      44%,


      rgba(
        0,
        0,
        0,
        0.04
      )
      70%,


      rgba(
        0,
        0,
        0,
        0.24
      )
      100%

    );


  mix-blend-mode:
    multiply;


  pointer-events:
    none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (
  max-width: 600px
) {

  .card {

    width:
      min(
        85vw,
        360px
      );

  }

}

</style>

</head>


<body>


<div class="card">

  <div class="card__rotator">


    <!-- ======================================================
         CARD IMAGE

         ★★★★★★★★★★★★★★★★★★★★★★★★★★

         只需要替换：

         card.png

         就可以换卡片。
    ======================================================= -->

    <img

      class="card__image"

      src="./card.png"

      alt=""

      draggable="false"

    >


    <!-- ======================================================
         CSS HOLOGRAPHIC LAYERS
    ======================================================= -->


    <!-- 连续光谱 -->
    <div
      class="card__spectrum"
    ></div>


    <!-- 柔和色散 -->
    <div
      class="card__spectrum-soft"
    ></div>


    <!-- 彩色泛光 -->
    <div
      class="card__iridescence"
    ></div>


    <!-- 微颗粒 -->
    <div
      class="card__grain"
    ></div>


    <!-- 微细方向纹 -->
    <div
      class="card__lines"
    ></div>


    <!-- 大面积镜面高光 -->
    <div
      class="card__specular"
    ></div>


    <!-- 宽反射带 -->
    <div
      class="card__reflection"
    ></div>


    <!-- 彩色反射边缘 -->
    <div
      class="card__color-reflection"
    ></div>


    <!-- 卡片边缘 -->
    <div
      class="card__edge"
    ></div>


    <!-- 边缘压暗 -->
    <div
      class="card__vignette"
    ></div>


  </div>

</div>


<script>

/* ============================================================
   DOM
============================================================ */

const card =
  document.querySelector(
    ".card"
  );


const rotator =
  document.querySelector(
    ".card__rotator"
  );


/* ============================================================
   STATE
============================================================ */

/*
  当前旋转
*/

const current = {

  x: 0,

  y: 0

};


/*
  目标旋转
*/

const target = {

  x: 0,

  y: 0

};


/*
  当前光源
*/

const light = {

  x: 50,

  y: 50

};


/*
  目标光源
*/

const targetLight = {

  x: 50,

  y: 50

};


/*
  Holo
*/

let holo =
  0.18;


let targetHolo =
  0.18;


/*
  摇晃能量
*/

let motionEnergy =
  0;


/*
  动画
*/

let animationFrame =
  null;


/*
  上一帧运动
*/

let previousMotion =
  0;


/* ============================================================
   SETTINGS
============================================================ */


/*
==============================================================
  手机灵敏度
==============================================================

  2.0  → 柔和

  2.8  → 灵敏

  3.1  → 很灵敏

  3.5  → 非常灵敏
*/

const SENSOR_SENSITIVITY =
  3.0;


/*
==============================================================
  最大倾斜
==============================================================
*/

const MAX_TILT =
  22;


/*
==============================================================
  卡片追踪速度
==============================================================
*/

const ORIENTATION_SMOOTH =
  0.24;


/*
==============================================================
  光源速度

  比卡片略慢。
==============================================================
*/

const LIGHT_SMOOTH =
  0.14;


/*
==============================================================
  Holo 变化速度
==============================================================
*/

const HOLO_SMOOTH =
  0.13;


/*
==============================================================
  Motion smoothing
==============================================================
*/

const MOTION_SMOOTH =
  0.38;


/*
==============================================================
  Motion decay

  更高 = 闪光持续更久
==============================================================
*/

const MOTION_DECAY =
  0.958;


/*
==============================================================
  摇晃灵敏度
==============================================================
*/

const MOTION_SENSITIVITY =
  0.11;


/*
==============================================================
  Flash 阈值
==============================================================
*/

const FLASH_THRESHOLD =
  2.5;


/*
==============================================================
  Flash 最小间隔
==============================================================
*/

const FLASH_COOLDOWN =
  260;


let lastFlash =
  0;


/* ============================================================
   SENSOR STATE
============================================================ */

let baseBeta =
  null;


let baseGamma =
  null;


let sensorEnabled =
  false;


let permissionRequested =
  false;


/* ============================================================
   FLASH
============================================================ */

const flash =
  document.createElement(
    "div"
  );


flash.style.position =
  "absolute";


flash.style.inset =
  "-35%";


flash.style.pointerEvents =
  "none";


flash.style.borderRadius =
  "inherit";


flash.style.opacity =
  "0";


flash.style.mixBlendMode =
  "screen";


/*
  双层：

  第一层 = 白色镜面

  第二层 = 非常弱的色边
*/

flash.style.background =

  `

  linear-gradient(

    108deg,

    transparent 26%,

    rgba(
      255,
      255,
      255,
      0
    ) 37%,

    rgba(
      255,
      255,
      255,
      0.18
    ) 44%,

    rgba(
      255,
      255,
      255,
      0.95
    ) 48.5%,

    rgba(
      255,
      255,
      255,
      1
    ) 50%,

    rgba(
      225,
      250,
      255,
      0.76
    ) 52%,

    rgba(
      255,
      255,
      255,
      0.18
    ) 56%,

    transparent 67%

  ),

  linear-gradient(

    108deg,

    transparent 33%,

    rgba(
      50,
      220,
      255,
      0
    ) 43%,

    rgba(
      60,
      220,
      255,
      0.20
    ) 47.5%,

    rgba(
      255,
      125,
      220,
      0.28
    ) 50%,

    rgba(
      130,
      155,
      255,
      0.22
    ) 53%,

    transparent 64%

  )

  `;


flash.style.transform =
  "translateX(-130%) skewX(-14deg)";


flash.style.filter =
  "blur(2px) brightness(1.4)";


rotator.appendChild(
  flash
);


/* ============================================================
   ENABLE SENSOR
============================================================ */

document.addEventListener(

  "pointerdown",

  () => {

    if (
      !permissionRequested
    ) {

      permissionRequested =
        true;

      enableSensors();

    }

  },

  {

    once:
      true,

    passive:
      true

  }

);


/* ============================================================
   ENABLE SENSORS
============================================================ */

async function enableSensors() {


  /*
  ==========================================================
    ORIENTATION
  ==========================================================
  */

  if (
    typeof DeviceOrientationEvent
    !==
    "undefined"
  ) {

    try {

      if (

        typeof
        DeviceOrientationEvent
          .requestPermission
        ===
        "function"

      ) {

        const permission =

          await
          DeviceOrientationEvent
            .requestPermission();


        if (
          permission ===
          "granted"
        ) {

          window.addEventListener(

            "deviceorientation",

            handleOrientation,

            true

          );

        }

      }

      else {

        window.addEventListener(

          "deviceorientation",

          handleOrientation,

          true

        );

      }

    }

    catch (
      error
    ) {

      console.warn(
        "Orientation permission:",
        error
      );

    }

  }


  /*
  ==========================================================
    MOTION
  ==========================================================
  */

  if (
    typeof DeviceMotionEvent
    !==
    "undefined"
  ) {

    try {

      if (

        typeof
        DeviceMotionEvent
          .requestPermission
        ===
        "function"

      ) {

        const permission =

          await
          DeviceMotionEvent
            .requestPermission();


        if (
          permission ===
          "granted"
        ) {

          window.addEventListener(

            "devicemotion",

            handleMotion,

            true

          );

        }

      }

      else {

        window.addEventListener(

          "devicemotion",

          handleMotion,

          true

        );

      }

    }

    catch (
      error
    ) {

      console.warn(
        "Motion permission:",
        error
      );

    }

  }


  sensorEnabled =
    true;


  startAnimation();

}


/* ============================================================
   ORIENTATION
============================================================ */

function handleOrientation(
  event
) {


  let beta =
    Number(
      event.beta
    );


  let gamma =
    Number(
      event.gamma
    );


  if (

    !Number.isFinite(
      beta
    )

    ||

    !Number.isFinite(
      gamma
    )

  ) {

    return;

  }


  /*
  ==========================================================
    第一次姿态 = 中心
  ==========================================================
  */

  if (

    baseBeta === null
    ||
    baseGamma === null

  ) {

    baseBeta =
      beta;


    baseGamma =
      gamma;


    target.x =
      0;


    target.y =
      0;


    targetLight.x =
      50;


    targetLight.y =
      50;


    startAnimation();


    return;

  }


  /*
  ==========================================================
    Relative
  ==========================================================
  */

  let deltaBeta =

    beta -
    baseBeta;


  let deltaGamma =

    gamma -
    baseGamma;


  /*
  ==========================================================
    Limit
  ==========================================================
  */

  deltaBeta =
    clamp(
      deltaBeta,
      -32,
      32
    );


  deltaGamma =
    clamp(
      deltaGamma,
      -32,
      32
    );


  /*
  ==========================================================
    Non-linear response

    小动作非常灵敏。

    大动作逐渐压缩。
  ==========================================================
  */

  let nx =

    deltaGamma /
    30;


  let ny =

    -deltaBeta /
    30;


  nx =

    Math.tanh(

      nx *
      SENSOR_SENSITIVITY

    );


  ny =

    Math.tanh(

      ny *
      SENSOR_SENSITIVITY

    );


  /*
  ==========================================================
    Rotation
  ==========================================================
  */

  target.y =

    nx *
    MAX_TILT;


  target.x =

    ny *
    MAX_TILT;


  /*
  ==========================================================
    Light
  ==========================================================
  */

  targetLight.x =

    50 +
    nx *
    47;


  targetLight.y =

    50 -
    ny *
    47;


  /*
  ==========================================================
    Holo intensity
  ==========================================================
  */

  const amount =

    Math.min(

      1,

      Math.sqrt(

        nx * nx
        +
        ny * ny

      )

    );


  targetHolo =

    0.20
    +
    amount *
    0.80;


  startAnimation();

}


/* ============================================================
   MOTION
============================================================ */

function handleMotion(
  event
) {


  const acceleration =

    event.acceleration
    ||
    event.accelerationIncludingGravity;


  if (!acceleration) {

    return;

  }


  const x =
    Number(
      acceleration.x
    )
    || 0;


  const y =
    Number(
      acceleration.y
    )
    || 0;


  const z =
    Number(
      acceleration.z
    )
    || 0;


  /*
  ==========================================================
    Magnitude
  ==========================================================
  */

  const magnitude =

    Math.sqrt(

      x * x
      +
      y * y
      +
      z * z

    );


  /*
  ==========================================================
    去除重力基准
  ==========================================================
  */

  const movement =

    Math.abs(

      magnitude -
      9.81

    );


  /*
  ==========================================================
    Energy
  ==========================================================
  */

  const energy =

    clamp(

      movement *
      MOTION_SENSITIVITY,

      0,
      1

    );


  motionEnergy +=

    (
      energy -
      motionEnergy
    )

    *
    MOTION_SMOOTH;


  /*
  ==========================================================
    强烈晃动：

    产生扫光
  ==========================================================
  */

  if (

    movement >
    FLASH_THRESHOLD

  ) {

    triggerFlash();

  }


  previousMotion =
    movement;


  startAnimation();

}


/* ============================================================
   FLASH
============================================================ */

function triggerFlash() {


  const now =
    performance.now();


  /*
  ------------------------------------------------------------
    cooldown
  ------------------------------------------------------------
  */

  if (

    now -
    lastFlash
    <
    FLASH_COOLDOWN

  ) {

    return;

  }


  lastFlash =
    now;


  /*
  ------------------------------------------------------------
    play
  ------------------------------------------------------------
  */

  flash.animate(

    [

      {

        opacity:
          0,

        transform:
          "translateX(-135%) skewX(-14deg)"

      },


      {

        opacity:
          1,

        transform:
          "translateX(-42%) skewX(-14deg)"

      },


      {

        opacity:
          0.72,

        transform:
          "translateX(-2%) skewX(-14deg)"

      },


      {

        opacity:
          0.24,

        transform:
          "translateX(55%) skewX(-14deg)"

      },


      {

        opacity:
          0,

        transform:
          "translateX(135%) skewX(-14deg)"

      }

    ],

    {

      duration:
        600,

      easing:
        "cubic-bezier(.08,.72,.18,1)",

      fill:
        "none"

    }

  );

}


/* ============================================================
   ANIMATION
============================================================ */

function startAnimation() {


  if (
    animationFrame ===
    null
  ) {

    animationFrame =

      requestAnimationFrame(
        animate
      );

  }

}


/* ============================================================
   LOOP
============================================================ */

function animate() {


  /*
  ==========================================================
    Card rotation
  ==========================================================
  */

  current.x +=

    (
      target.x -
      current.x
    )

    *
    ORIENTATION_SMOOTH;


  current.y +=

    (
      target.y -
      current.y
    )

    *
    ORIENTATION_SMOOTH;


  /*
  ==========================================================
    Light
  ==========================================================
  */

  light.x +=

    (
      targetLight.x -
      light.x
    )

    *
    LIGHT_SMOOTH;


  light.y +=

    (
      targetLight.y -
      light.y
    )

    *
    LIGHT_SMOOTH;


  /*
  ==========================================================
    Holo
  ==========================================================
  */

  holo +=

    (
      targetHolo -
      holo
    )

    *
    HOLO_SMOOTH;


  /*
  ==========================================================
    Motion decay
  ==========================================================
  */

  motionEnergy *=
    MOTION_DECAY;


  /*
  ==========================================================
    CSS variables
  ==========================================================
  */

  rotator.style.setProperty(

    "--rotate-x",

    `${current.x.toFixed(3)}deg`

  );


  rotator.style.setProperty(

    "--rotate-y",

    `${current.y.toFixed(3)}deg`

  );


  rotator.style.setProperty(

    "--light-x",

    `${light.x.toFixed(2)}%`

  );


  rotator.style.setProperty(

    "--light-y",

    `${light.y.toFixed(2)}%`

  );


  /*
    第二光源：

    比实际光源移动得略远。
  */

  const lightX2 =

    50 +

    (
      light.x -
      50
    )
    *
    1.30;


  const lightY2 =

    50 +

    (
      light.y -
      50
    )
    *
    1.15;


  rotator.style.setProperty(

    "--light-x2",

    `${clamp(
      lightX2,
      -10,
      110
    ).toFixed(2)}%`

  );


  rotator.style.setProperty(

    "--light-y2",

    `${clamp(
      lightY2,
      -10,
      110
    ).toFixed(2)}%`

  );


  /*
  ==========================================================
    Holo
  ==========================================================
  */

  rotator.style.setProperty(

    "--holo",

    holo.toFixed(3)

  );


  /*
  ==========================================================
    Motion
  ==========================================================
  */

  rotator.style.setProperty(

    "--motion",

    motionEnergy.toFixed(3)

  );


  /*
  ==========================================================
    Continue?
  ==========================================================
  */

  const moving =

    Math.abs(
      target.x -
      current.x
    )
    >
    0.01

    ||

    Math.abs(
      target.y -
      current.y
    )
    >
    0.01

    ||

    Math.abs(
      targetLight.x -
      light.x
    )
    >
    0.01

    ||

    Math.abs(
      targetLight.y -
      light.y
    )
    >
    0.01

    ||

    Math.abs(
      targetHolo -
      holo
    )
    >
    0.01

    ||

    motionEnergy
    >
    0.01;


  if (moving) {

    animationFrame =

      requestAnimationFrame(
        animate
      );

  }

  else {

    animationFrame =
      null;

  }

}


/* ============================================================
   DOUBLE TAP = RECALIBRATE
============================================================ */

let lastTap =
  0;


card.addEventListener(

  "pointerup",

  () => {


    const now =
      performance.now();


    if (

      now -
      lastTap
      <
      350

    ) {

      recalibrate();

    }


    lastTap =
      now;

  },

  {
    passive:
      true
  }

);


function recalibrate() {

  /*
    下一次收到姿态数据：

    当前姿态 = 中心。
  */

  baseBeta =
    null;


  baseGamma =
    null;

}


/* ============================================================
   DESKTOP FALLBACK
============================================================ */

card.addEventListener(

  "pointermove",

  event => {


    /*
      有手机传感器时：
      不使用鼠标。
    */

    if (
      sensorEnabled
    ) {

      return;

    }


    const rect =
      card.getBoundingClientRect();


    const x =

      clamp(

        (
          (
            event.clientX -
            rect.left
          )

          /
          rect.width

        )
        *
        100,

        0,
        100

      );


    const y =

      clamp(

        (
          (
            event.clientY -
            rect.top
          )

          /
          rect.height

        )
        *
        100,

        0,
        100

      );


    const nx =

      (
        x -
        50
      )
      /
      50;


    const ny =

      (
        50 -
        y
      )
      /
      50;


    /*
      Rotation
    */

    target.y =
      nx *
      MAX_TILT;


    target.x =
      ny *
      MAX_TILT;


    /*
      Light
    */

    targetLight.x =
      x;


    targetLight.y =
      y;


    /*
      Holo
    */

    targetHolo =

      0.20

      +

      Math.min(

        0.80,

        Math.sqrt(

          nx * nx
          +
          ny * ny

        )

      );


    startAnimation();

  }

);


/* ============================================================
   DESKTOP LEAVE
============================================================ */

card.addEventListener(

  "pointerleave",

  () => {


    if (
      sensorEnabled
    ) {

      return;

    }


    target.x =
      0;


    target.y =
      0;


    targetLight.x =
      50;


    targetLight.y =
      50;


    targetHolo =
      0.18;


    startAnimation();

  }

);


/* ============================================================
   INITIAL
============================================================ */

applyInitialState();


function applyInitialState() {

  rotator.style.setProperty(
    "--rotate-x",
    "0deg"
  );


  rotator.style.setProperty(
    "--rotate-y",
    "0deg"
  );


  rotator.style.setProperty(
    "--light-x",
    "50%"
  );


  rotator.style.setProperty(
    "--light-y",
    "50%"
  );


  rotator.style.setProperty(
    "--light-x2",
    "50%"
  );


  rotator.style.setProperty(
    "--light-y2",
    "50%"
  );


  rotator.style.setProperty(
    "--holo",
    "0.18"
  );


  rotator.style.setProperty(
    "--motion",
    "0"
  );

}

</script>
